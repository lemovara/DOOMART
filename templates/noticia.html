{% extends "base.html" %}


{% block title %}
{{ noticia.titulo }} · DOOMART
{% endblock %}


{% block content %}

<section class="single-news">

    <div class="container">

        <a
            href="{{ url_for('index') }}"
            class="back-link"
        >
            ← VOLVER A DOOMART
        </a>


        <article class="single-news-card">

            <div class="single-news-image">

                <img
                    src="{{ url_for(
                        'static',
                        filename='img/' + noticia.imagen
                    ) }}"
                    alt="{{ noticia.titulo }}"
                >

            </div>


            <div class="single-news-content">

                <span class="single-news-category">

                    {% if zona == "tlaxcala" %}

                        TLAXCALA

                    {% else %}

                        MUNDIAL

                    {% endif %}

                </span>


                <h1>
                    {{ noticia.titulo }}
                </h1>


                <p class="single-news-text">
                    {{ noticia.texto }}
                </p>


                <a
                    href="{{ url_for('index') }}"
                    class="news-back-button"
                >
                    VOLVER
                </a>

            </div>

        </article>

    </div>

</section>

{% endblock %}
